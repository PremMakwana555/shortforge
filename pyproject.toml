[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "shortforge"
version = "0.1.0"
description = "Event-driven multi-agent platform that turns a topic into a production-ready short-form video using free / open-source AI models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prem Makwana" }]
# Everything the pipeline can use is a regular dependency: `uv sync` gives a complete install.
# (Only system binaries stay outside uv: ffmpeg is required, espeak-ng is an optional fallback voice.)
dependencies = [
  # core
  "httpx>=0.27",
  "pydantic>=2.6",
  "pillow>=10.0",
  # HTTP service (Cloud Run / container entrypoint)
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  # neural open-source voice (GPL-3.0); the voice model downloads on first use
  "piper-tts>=1.2",
  # GCP backends: Pub/Sub, Firestore, GCS
  "google-cloud-pubsub>=2.21",
  "google-cloud-firestore>=2.16",
  "google-cloud-storage>=2.16",
  # YouTube publishing
  "google-api-python-client>=2.120",
  "google-auth>=2.29",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "respx>=0.21"]

[tool.uv]
# `uv sync` also installs the dev group (pytest, ruff, respx); `uv sync --no-dev` for runtime only.
default-groups = ["dev"]

[project.scripts]
shortforge = "shortforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shortforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: full pipeline render (needs ffmpeg)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC240", "ASYNC109"]  # tiny local stat calls; explicit subprocess timeouts are intended
