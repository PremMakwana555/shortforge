name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System deps (ffmpeg, espeak-ng, fonts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Unit + integration tests
        run: pytest -q -m "not e2e"
      - name: End-to-end offline render (real FFmpeg + espeak-ng)
        run: pytest -q -m e2e
      - name: CLI smoke run
        env:
          SF_RENDER_PRESET: ultrafast
          SF_VIDEO_WIDTH: "540"
          SF_VIDEO_HEIGHT: "960"
        run: shortforge run "the elevator that stops at floor 13" --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-short
          path: output/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shortforge:ci .
      - name: Container health check
        run: |
          docker run -d --name sf -p 8080:8080 -e SF_OFFLINE=1 shortforge:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs -X POST localhost:8080/jobs -H 'Content-Type: application/json' -d '{"topic":"the well behind the school"}'
          docker logs sf | tail -20
