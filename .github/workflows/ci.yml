name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: System deps (ffmpeg, espeak-ng, fonts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
      - name: Install (locked)
        run: uv sync --locked
      - run: uv run ruff check src tests
      - name: Unit + integration tests
        run: uv run pytest -q -m "not e2e"
      - name: End-to-end offline render (real FFmpeg + espeak-ng)
        run: uv run pytest -q -m e2e
      - name: Doctor (downloads the Piper voice)
        run: uv run shortforge doctor --fix
      - name: CLI smoke run (native, Piper voice)
        env:
          SF_RENDER_PRESET: ultrafast
          SF_VIDEO_WIDTH: "540"
          SF_VIDEO_HEIGHT: "960"
        run: |
          uv run shortforge run "the elevator that stops at floor 13" --offline
          JOB=$(ls output | head -1)
          uv run shortforge status "$JOB" --json | python -c "import json,sys; j=json.load(sys.stdin); p=j['stages']['voiceover']['output']['provider']; print('voice:', p); assert p == 'piper', p"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-short
          path: output/
          retention-days: 7

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
    env:
      IMAGE: localhost/shortforge:ci
    steps:
      - uses: actions/checkout@v4
      - name: Build image (${{ matrix.engine }})
        run: |
          FLAGS=""; [ "${{ matrix.engine }}" = podman ] && FLAGS="--format docker"
          ${{ matrix.engine }} build $FLAGS -t "$IMAGE" .
      - name: Piper neural voice works inside the image
        run: |
          ${{ matrix.engine }} run --rm "$IMAGE" sh -c \
            'echo "The lighthouse light came on by itself." | piper -m "$SF_CACHE_DIR/voices/en_US-ryan-medium.onnx" -f /tmp/t.wav && test -s /tmp/t.wav && echo piper-ok'
      - name: HTTP service health + job submission
        run: |
          ${{ matrix.engine }} run -d --name sf -p 8080:8080 -e SF_OFFLINE=1 "$IMAGE"
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs -X POST localhost:8080/jobs -H 'Content-Type: application/json' -d '{"topic":"the well behind the school"}'
          ${{ matrix.engine }} logs sf | tail -20
      - name: Full pipeline in a container (Piper voice, bind-mounted output)
        run: |
          mkdir -p output && chmod 777 output
          USERNS=""; [ "${{ matrix.engine }}" = podman ] && USERNS="--userns=keep-id:uid=10001,gid=10001"
          ${{ matrix.engine }} run --rm $USERNS -e SF_OFFLINE=1 -e SF_RENDER_PRESET=ultrafast \
            -e SF_VIDEO_WIDTH=540 -e SF_VIDEO_HEIGHT=960 \
            -v "$PWD/output:/data/output:Z" "$IMAGE" shortforge run "the radio station that broadcasts at 3am"
          ls -la output/*/
          test -s output/*/video.mp4
